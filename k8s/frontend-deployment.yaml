apiVersion: apps/v1
kind: Deployment
metadata:
  name: elearning-frontend
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: your-dockerhub-username/elearning-frontend:latest
        ports:
        - containerPort: 80
